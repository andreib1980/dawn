name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # -------------------------------------------------------------------------
  # Job 1: Format Check (~30s)
  # Runs on ubuntu-22.04 which has clang-format-14 available
  # -------------------------------------------------------------------------
  format-check:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install clang-format-14
        run: sudo apt-get update && sudo apt-get install -y clang-format-14

      - name: Install Prettier
        run: npm install

      - name: Check formatting
        run: ./format_code.sh --check

      # Outbound markdown funnel invariant: every driver->send_text() CALL must
      # go through the messaging_deliver / engine_send_async funnel (which
      # renders the canonical markdown into the driver's out_format + escapes
      # it).  A direct call from anywhere else would ship raw markdown and, for
      # Telegram (parse_mode=HTML), get the whole message rejected with HTTP
      # 400.  Drivers are not reachable outside src/messaging (find_driver is
      # engine-internal), so only these three files may call send_text.
      - name: Messaging send_text funnel invariant
        run: |
          bad=$(grep -rn -- '->send_text(' src/messaging/ \
            | grep -vE 'messaging_engine\.c|messaging_engine_link\.c|messaging_engine_inbound\.c' \
            || true)
          if [ -n "$bad" ]; then
            echo "$bad"
            echo "ERROR: driver->send_text() called outside the messaging_deliver funnel."
            echo "Route outbound replies through messaging_deliver() or messaging_engine_send()."
            exit 1
          fi

  # -------------------------------------------------------------------------
  # Job 2: Unit Tests (~2 min)
  # Uses ci CMake preset: WEBUI=OFF, TUI=OFF, AEC=OFF, VOSK=ON
  # No submodules needed (VOSK=ON skips whisper.cpp submodule)
  # -------------------------------------------------------------------------
  unit-tests:
    needs: format-check
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake build-essential pkg-config \
            libcurl4-openssl-dev libjson-c-dev libssl-dev libsqlite3-dev \
            libsodium-dev libspdlog-dev libmosquitto-dev \
            libflac-dev libsamplerate0-dev libsndfile1-dev \
            libmpg123-dev libvorbis-dev \
            libmupdf-dev libfreetype-dev libharfbuzz-dev libzip-dev libxml2-dev \
            libmujs-dev libgumbo-dev libopenjp2-7-dev libjbig2dec0-dev libjpeg-dev \
            libical-dev \
            libstemmer-dev

      - name: Configure (ci preset)
        run: cmake --preset ci

      - name: Build CI tests
        run: make -C build-ci -j"$(nproc)" tests-ci

      - name: Run tests
        run: ctest --test-dir build-ci --output-on-failure --no-tests=error -L ci

  # -------------------------------------------------------------------------
  # Job 3: Docker Build (~10 min)
  # Builds full image (deps + server compile + runtime) and smoke tests it
  # -------------------------------------------------------------------------
  docker-build:
    needs: format-check
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          submodules: recursive

      - name: Build Docker image
        run: docker build -t dawn .

      - name: Smoke test
        run: docker run --rm dawn --help

  # -------------------------------------------------------------------------
  # Job 4: Tier 1 Satellite Build (~1 min)
  # Headless config (no ML deps): VAD/ASR/TTS/SDL all OFF, so it builds with
  # apt-only libs (lws, json-c, alsa, opus) — no ONNX Runtime / Vosk / whisper.
  # Compiles ws_client.c + main.c + voice_processing.c, which is exactly where
  # config-gated breakage hides (e.g. an unconditional include resolved only in
  # the SDL build, or a VAD-off path calling vad_silero_cleanup unguarded). The
  # full ML build is exercised by the developer's pre-push hook on hardware.
  # -------------------------------------------------------------------------
  satellite-build:
    needs: format-check
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake build-essential pkg-config \
            libwebsockets-dev libjson-c-dev libasound2-dev libopus-dev

      - name: Configure (headless Tier 1, no ML deps)
        run: >
          cmake -S dawn_satellite -B dawn_satellite/build-ci
          -DENABLE_VAD=OFF -DENABLE_WHISPER_ASR=OFF -DENABLE_VOSK_ASR=OFF
          -DENABLE_TTS=OFF -DENABLE_SDL_UI=OFF -DENABLE_DISPLAY=OFF

      - name: Build
        run: make -C dawn_satellite/build-ci -j"$(nproc)"
