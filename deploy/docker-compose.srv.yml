name: dawn

services:
   dawn:
      image: ${DAWN_IMAGE:?DAWN_IMAGE is required}
      pull_policy: never
      container_name: dawn
      restart: unless-stopped
      command:
         - --server
         - --config
         - /var/lib/dawn/dawn.toml
      working_dir: /var/lib/dawn
      environment:
         HOME: /var/lib/dawn
      expose:
         - '3000'
      volumes:
         - dawn_data:/var/lib/dawn
         - ${DAWN_SERVICE_ROOT:-/home/andrei/services/dawn}/config/dawn.toml:/var/lib/dawn/dawn.toml:ro
         - ${DAWN_SERVICE_ROOT:-/home/andrei/services/dawn}/config/secrets.toml:/var/lib/dawn/secrets.toml:ro
         - ${DAWN_SERVICE_ROOT:-/home/andrei/services/dawn}/models:/var/lib/dawn/models:ro
      read_only: true
      tmpfs:
         - /tmp:rw,noexec,nosuid,nodev,mode=1777
      cap_drop:
         - ALL
      security_opt:
         - no-new-privileges:true
      stop_grace_period: 30s
      healthcheck:
         test:
            - CMD-SHELL
            - /opt/dawn/bin/dawn-admin ping || exit 1
         interval: 10s
         timeout: 5s
         retries: 18
         start_period: 20s
      logging:
         driver: json-file
         options:
            max-size: 10m
            max-file: '3'
      labels:
         org.opencontainers.image.revision: ${DAWN_COMMIT_SHA:-unknown}
      networks:
         - dawn_backend

   ingress:
      image: ${DAWN_INGRESS_IMAGE:?DAWN_INGRESS_IMAGE is required}
      pull_policy: never
      container_name: dawn-ingress
      restart: unless-stopped
      environment:
         CLOUDFLARE_API_TOKEN: ${DAWN_CLOUDFLARE_DNS_API_TOKEN:?DAWN_CLOUDFLARE_DNS_API_TOKEN is required}
      volumes:
         - dawn_caddy_data:/data
         - dawn_caddy_config:/config
      read_only: true
      tmpfs:
         - /tmp:rw,noexec,nosuid,nodev,mode=1777
      cap_drop:
         - ALL
      cap_add:
         - NET_BIND_SERVICE
      security_opt:
         - no-new-privileges:true
      depends_on:
         dawn:
            condition: service_healthy
      healthcheck:
         test:
            - CMD-SHELL
            - wget --quiet --spider http://127.0.0.1/healthz
         interval: 10s
         timeout: 5s
         retries: 18
         start_period: 10s
      logging:
         driver: json-file
         options:
            max-size: 10m
            max-file: '3'
      labels:
         org.opencontainers.image.revision: ${DAWN_COMMIT_SHA:-unknown}
      networks:
         dawn_backend:
         dawn_infra:
            ipv4_address: 10.0.254.230

volumes:
   dawn_data:
      external: true
      name: dawn_data

   dawn_caddy_data:
      external: true
      name: dawn_caddy_data

   dawn_caddy_config:
      external: true
      name: dawn_caddy_config

networks:
   dawn_backend:
      name: dawn_backend

   dawn_infra:
      external: true
      name: dawn_infra
